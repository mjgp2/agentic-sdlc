<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">AI coding guidance workflow map</title>
  <desc id="desc">A workflow showing intake, isolated worktree execution, numeric guardrails, architecture review, verification, and PR handoff.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e7eef7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f6f73"/>
      <stop offset="1" stop-color="#7a5631"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#24313a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="980" height="520" rx="26" fill="#eef3f7"/>
  <path d="M70 92 C250 18 356 154 503 96 C686 24 766 122 910 70 L910 450 C724 506 622 398 473 450 C290 514 198 382 70 438 Z" fill="#d9e5e8"/>
  <g filter="url(#shadow)">
    <rect x="72" y="68" width="180" height="116" rx="18" fill="url(#panel)"/>
    <rect x="300" y="68" width="180" height="116" rx="18" fill="url(#panel)"/>
    <rect x="528" y="68" width="180" height="116" rx="18" fill="url(#panel)"/>
    <rect x="756" y="68" width="152" height="116" rx="18" fill="url(#panel)"/>
    <rect x="118" y="292" width="190" height="120" rx="18" fill="#fff8ed"/>
    <rect x="396" y="292" width="190" height="120" rx="18" fill="#eef9f4"/>
    <rect x="674" y="292" width="190" height="120" rx="18" fill="#f7f2ff"/>
  </g>
  <g fill="none" stroke="#51626c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 126 H300"/>
    <path d="M480 126 H528"/>
    <path d="M708 126 H756"/>
    <path d="M832 184 C832 248 770 268 770 292"/>
    <path d="M674 352 H586"/>
    <path d="M396 352 H308"/>
    <path d="M213 292 C214 242 162 228 162 184"/>
  </g>
  <g fill="#1d2a31" font-family="Inter, Arial, sans-serif">
    <text x="102" y="112" font-size="22" font-weight="700">Task brief</text>
    <text x="102" y="144" font-size="15">Outcome, risks,</text>
    <text x="102" y="165" font-size="15">guardrails</text>
    <text x="330" y="112" font-size="22" font-weight="700">Worktree</text>
    <text x="330" y="144" font-size="15">Branch per agent,</text>
    <text x="330" y="165" font-size="15">clean diff boundary</text>
    <text x="558" y="112" font-size="22" font-weight="700">Execution</text>
    <text x="558" y="144" font-size="15">Small edits, tests,</text>
    <text x="558" y="165" font-size="15">frequent checks</text>
    <text x="786" y="112" font-size="22" font-weight="700">FTA</text>
    <text x="786" y="144" font-size="15">Complexity and</text>
    <text x="786" y="165" font-size="15">risk thresholds</text>
    <text x="148" y="337" font-size="22" font-weight="700">Architecture</text>
    <text x="148" y="369" font-size="15">Boundaries, ADRs,</text>
    <text x="148" y="390" font-size="15">ownership rules</text>
    <text x="426" y="337" font-size="22" font-weight="700">Verification</text>
    <text x="426" y="369" font-size="15">Typecheck, unit,</text>
    <text x="426" y="390" font-size="15">coverage, smoke</text>
    <text x="704" y="337" font-size="22" font-weight="700">PR handoff</text>
    <text x="704" y="369" font-size="15">Evidence, risks,</text>
    <text x="704" y="390" font-size="15">review notes</text>
  </g>
  <rect x="356" y="226" width="268" height="54" rx="27" fill="url(#accent)"/>
  <text x="392" y="260" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Measure, then merge</text>
</svg>
